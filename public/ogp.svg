<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#080808"/>

  <!-- Top accent bar -->
  <rect width="1200" height="5" fill="#007AFF"/>

  <!-- Brand pill -->
  <rect x="100" y="80" width="160" height="36" rx="18" fill="rgba(0,122,255,0.18)"/>
  <text x="180" y="103" text-anchor="middle" fill="#007AFF" font-size="15" font-weight="700"
        font-family="'Helvetica Neue', Arial, sans-serif" letter-spacing="1">2026年夏 リリース予定</text>

  <!-- App name -->
  <text x="100" y="210" fill="#ffffff" font-size="88" font-weight="800"
        font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Helvetica Neue', Arial, sans-serif"
        letter-spacing="-2">ウカレル</text>

  <!-- Tagline -->
  <text x="100" y="278" fill="#007AFF" font-size="28" font-weight="700"
        font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Helvetica Neue', Arial, sans-serif">
    宅建独学を合格まで導く学習アプリ
  </text>

  <!-- Sub copy line 1 -->
  <text x="100" y="340" fill="rgba(255,255,255,0.6)" font-size="22" font-weight="500"
        font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Helvetica Neue', Arial, sans-serif">
    何を勉強すれば受かるか分かる
  </text>
  <!-- Sub copy line 2 -->
  <text x="100" y="374" fill="rgba(255,255,255,0.6)" font-size="22" font-weight="500"
        font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Helvetica Neue', Arial, sans-serif">
    宅建合格ナビゲーション
  </text>

  <!-- Divider -->
  <rect x="100" y="420" width="1000" height="1" fill="rgba(255,255,255,0.1)"/>

  <!-- Free badge -->
  <rect x="100" y="450" width="180" height="42" rx="21" fill="#34C759"/>
  <text x="190" y="477" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700"
        font-family="'Helvetica Neue', Arial, sans-serif">初回30日無料</text>

  <!-- Domain -->
  <text x="1100" y="590" text-anchor="end" fill="rgba(255,255,255,0.3)" font-size="18"
        font-family="'Helvetica Neue', Arial, sans-serif">dokugakulink.com</text>
</svg>
